<!DOCTYPE html><html><head><title>Dashboard</title><style>body{font-family:Arial;margin:30px;background:#f4f6f9}.container{max-width:950px;margin:auto;background:white;padding:25px;border-radius:8px}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{padding:12px;border:1px solid #ddd;text-align:left}th{background:#343a40;color:white}.badge{background:#28a745;color:white;padding:4px 8px;border-radius:4px}</style></head><body><div class="container"><a href="/create/">&larr; Back</a><h2>Dashboard</h2><table><thead><tr><th>Food Item</th><th>Quantity</th><th>Location</th><th>Status</th><th>NGO Connected</th></tr></thead><tbody>{% for d in donations %}<tr><td>{{ d.food_name }}</td><td>{{ d.quantity }}</td><td>{{ d.location }}</td><td><span class="badge">Available</span></td><td>Kerala Food Rescue</td></tr>{% empty %}<tr><td colspan="5" style="text-align:center">No donations found.</td></tr>{% endfor %}</tbody></table></div></body></html>
